name = "doodlewars"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "doodlewars"
database_id = "179a88a3-de71-42d8-9781-d552dc6e0437"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "doodlewars-images"

[dev]
port = 8811

[triggers]
crons = ["* * * * *"]

[vars]
TOKEN_ADDRESS = ""
MIN_HOLD = "1"
JUDGE_MODEL = "claude-haiku-5-5"
